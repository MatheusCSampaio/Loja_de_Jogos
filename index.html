<!DOCTYPE html>
<html lang="PT_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Games</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <header>
        <h1>Store games</h1>

        <div class="topo">
            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar Jogo..."
            >

            <button id = "carrinho-btn">
                Carrinho (<span id ="contador">0</span>)
            </button>
        </div>
    </header>

    <section class="banner">
        <h2>Inauguração da loja!</h2>
        <h3>Novos jogos em promoção!</h3>
    </section>

    <main class="catalago">

        <div class="card">
            <img src="./img/Minecraft.jpg" alt="Minecraft">
            <!--img/ex.jpg-->

            <h2>Minecraft</h2>
            <p>R$49,90</p>

            <button class="comprar">
                Adicionar ao Carrinho
            </button>
        </div>

        <div class="card">
            <img src="./img/Marvels-Spider-Man.webp" alt="Spider-Man">

            <h2>Marvel´s Spider-Man</h2>
            <p>R$99,90</p>

            <button class="comprar">
                Adicionar ao Carrinho
            </button>
        </div>

        <div class="card">
            <img src="./img/GTA IV.jpg" alt="GTA IV">

            <h2>Grand Theft Auto IV</h2>
            <p>R$450,00 Versão base</p>
            <p>R$600,00 Deluxe</p>

            <button class="comprar">
                Adicionar ao Carrinho
            </button>
        </div>
    </main>

    <footer>
        <p>Desenvolvido por Matheus Cavalcante Sampaio</p>
    </footer>

    <js>
    <script class="js"></script>
</body>
</html>

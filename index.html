<!DOCTYPE html>
<html lang="PT_BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Games</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="./img/logo.png">
</head>
<body>
    
    <header>
        <div class="logo">
            <img src="./img/logo.png">
            <h1>Store Games</h1>
        </div>

        <div class="topo">
            <input
                type="text"
                id="pesquisa"
                placeholder="Pesquisar Jogo..."
            >

            <button id = "carrinho-btn">
                🛒 (<span id ="contador">0</span>)
            </button>
        </div>
    </header>

    <section class="banner">
        <h2>Inauguração da loja!</h2>
        <h3>Novos jogos em promoção!</h3>
    </section>

    <main class="catalogo">

        <div class="card">
            <img src="./img/Minecraft.jpg" alt="Minecraft">
            <!--img/ex.jpg-->

            <h2>Minecraft</h2>
            <p>R$99,90</p>

            <button 
                class="comprar"
                data-nome="Minecraft"
                data-preco="99.90">

                Adicionar ao Carrinho
            </button>
        </div>

        <div class="card">
            <img src="./img/Marvels-Spider-Man.webp" alt="Spider-Man">

            <h2>Marvel´s Spider-Man</h2>
            <p>R$249,90</p>

            <button 
                class="comprar"
                data-nome="Spider-Man"
                data-preco="249,90">
            
                Adicionar ao Carrinho
            </button>
        </div>

        <div class="card">
            <img src="./img/GTA VI.jpg" alt="GTA VI">

            <h2>Grand Theft Auto VI</h2>
            <p>R$600,00</p>

            <button 
                class="comprar"
                data-nome="GTA VI"
                data-preco="600,00">

                Adicionar ao Carrinho
            </button>
        </div>

        <div class="card">
            <img src="./img/GOW.jpg" alt="GOW">

            <h2>God of War</h2>
            <p>R$199,90</p>

            <button 
                class="comprar"
                data-nome="GOW"
                data-preco="199,90">

                Adicionar ao Carrinho
            </button>
        </div>
    </main>

    <div id="carrinho-modal">
            <h2>Meu Carrinho</h2>
            
            <div id="lista-carrinho"></div>

            <p id="total">
                total: R$0,00
            </p>

            <button id="fechar-modal">
                X
            </button>

            <button id="comprar-final">
                Comprar
            </button>
        </div>

    <footer>
        <p>Desenvolvido por Matheus Cavalcante Sampaio</p>
    </footer>

    <script src="js/logica.js"></script>
</body>
</html>
